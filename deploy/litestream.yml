# Litestream continuous backup for a project's SQLite database. Replicates to a local directory
# (or S3-compatible storage you control) — nothing leaves your machines.
#
# Paths are placeholders so this file carries no host specifics. Replace them, or generate the
# config from your environment:
#
#   sed -e "s|__DATA_DIR__|$HIVEMIND_DATA_DIR|" -e "s|__BACKUP_DIR__|$HIVEMIND_BACKUP_DIR|" \
#       deploy/litestream.yml > /tmp/litestream.yml && litestream replicate -config /tmp/litestream.yml
dbs:
  - path: __DATA_DIR__/projects/default/hivemind.db
    replicas:
      - type: file
        path: __BACKUP_DIR__/litestream/default
# Add one block per project.
