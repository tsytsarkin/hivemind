# uv workspace root — see https://docs.astral.sh/uv/concepts/projects/workspaces/
[project]
name = "hivemind-workspace"
version = "1.4.0"
description = "Hivemind — shared agent knowledge-graph + artifact store + tool registry"
requires-python = ">=3.9"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
hivemind-server = { workspace = true }
hivemind = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "httpx>=0.27",
       "hivemind-server", "hivemind"]

[tool.pytest.ini_options]
# A wedged test must present as a red test, not as a machine to go and find. Measured:
# disabling the bus ACL re-check turned test_a_live_socket_is_dropped_when_its_user_loses_access
# into an infinite loop — three of them were found running 2h15m each at 7.0/7.1/10.6 GB RSS,
# because the suite has no upper bound of its own. 60 s is many times the runtime of the ENTIRE
# suite — which finishes in seconds, not minutes — so it can only fire on a genuine hang, never on
# a slow machine. No test count or timing figure on purpose: the suite gains tests most days and a
# number here would be stale within the week.
#
# "thread", not the default "signal": the signal method only interrupts the main thread, and
# a hang inside an event loop or a worker thread is exactly the case this exists for.
timeout = 60
timeout_method = "thread"
