[project]
name = "hivemind"
version = "0.1.0"
description = "Hivemind client + CLI: talk to a hivemind server (graph, artifacts, tools, guide)"
readme = "README.md"
requires-python = ">=3.9"           # MUST run on the Mac Studio's system Python 3.9.6
license = "MIT"
authors = [{ name = "Nik Tsytsarkin" }]
dependencies = [
    "httpx>=0.27,<1",               # the ONLY runtime dep — keep the client trivially deployable
]

[project.scripts]
hivemind = "hivemind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]
