[project]
name = "hivemind"
version = "0.1.0"
description = "Hivemind client + CLI: talk to a hivemind server (graph, artifacts, tools, guide)"
readme = "README.md"
requires-python = ">=3.9"           # MUST run on the Mac Studio's system Python 3.9.6
license = "Apache-2.0"
authors = [{ name = "Nik Tsytsarkin" }]
dependencies = [
    "httpx>=0.27,<1",               # graph/artifact/tool calls
    # The bus listener needs a WebSocket client and httpx has none. Pure-Python wheel, no build
    # step, so the client stays trivially deployable on a stock interpreter.
    "websockets>=12,<18",
]

[project.scripts]
hivemind = "hivemind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind"]
