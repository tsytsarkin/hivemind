[project]
name = "hivemind-server"
version = "0.1.0"
description = "Hivemind server: shared agent knowledge-graph + artifact store + tool registry (MCP + REST)"
readme = "README.md"
requires-python = ">=3.11"          # official `mcp` 2.0 SDK requires >=3.10; we pin 3.11
license = "MIT"
authors = [{ name = "Nik Tsytsarkin" }]
dependencies = [
    "mcp>=2.0,<3",                  # official MCP Python SDK (MCPServer, streamable HTTP)
    "starlette>=0.40,<1",           # ASGI host for the MCP mount + REST custom routes
    "uvicorn[standard]>=0.30,<1",   # ASGI server (uvloop/httptools for throughput)
    "jsonschema>=4.21,<5",          # JSON Schema 2020-12 validation of node/edge props
    "httpx>=0.27,<1",               # used by tools that call out; also test client
]

[project.scripts]
hivemind-server = "hivemind_server.app:main"
hivemind-admin = "hivemind_server.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hivemind_server"]
